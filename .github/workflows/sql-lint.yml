name: SQL Lint

on: [push, pull_request]

jobs:
  sqlfluff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Run sqlfluff lint
        run: sqlfluff lint src/**/*.sql
